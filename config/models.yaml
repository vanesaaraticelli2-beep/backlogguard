# Modelo por agente. Punto de partida: la evaluación compara configuraciones (A/B).
# Reglas validadas en código (src/backlogguard/llm/model_config.py):
#   - el Crítico debe ser independiente de Requerimientos (otro proveedor o modelo);
#   - effort solo aplica a modelos de Anthropic.
agents:
  supervisor:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: low
  requerimientos:
    # 2026-10-25: Sonnet reemplaza a Haiku (con documentos reales Haiku cubrió 4 de al menos 8 requisitos de la reunión)
    # y a Gemini (cuota gratuita de 20 pedidos/día). A contrastar en la evaluación (A/B).
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
  critico:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
  auditor:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
  integracion:
    provider: anthropic
    model: claude-haiku-5-5
    effort: low
