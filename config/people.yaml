# Roles con los que se puede decidir. Es genérico: no hay nombres de personas ni autenticación.
# `name` es lo que queda en el registro de auditoría como quien decidió; `role` debe coincidir con el que
# fija config/policy.yaml para cada decisión (quién aprueba un cambio de alcance, un desacuerdo o el plan).
people:
  - name: service_manager
    display: Service Manager
    role: service_manager
  - name: product_owner
    display: Product Owner
    role: product_owner
  - name: full_stack_ia_engineer
    display: Full Stack IA Engineer
    role: full_stack_ia_engineer
