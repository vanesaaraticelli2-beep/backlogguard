# USD por millón de tokens, para estimar el costo de una corrida (fuera del curso).
# Claude: precios vigentes al 2026-10-06, a verificar en el proveedor antes de citar cifras.
# Un modelo sin precio acá se muestra como "sin precio": el costo no se inventa.
models:
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  gemini-3.8-flash: {input: 0.25, output: 1.50}
