[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backlogguard"
version = "0.1.0"
description = "BacklogGuard: sistema multiagente que convierte reuniones y preventa en un backlog verificado y trazable."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=1.0", "google-genai>=1.0"]
rag = ["numpy>=1.26", "qdrant-client==1.18.0", "pypdf>=5.0"]
graph = ["langgraph==1.2.17", "langgraph-checkpoint-sqlite==3.1.2"]
ui = ["streamlit==1.66.1"]
export = ["python-docx>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
backlogguard = ["agents/*/agent.md"]
